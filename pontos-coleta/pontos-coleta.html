<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="style-pontos-coleta.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
        integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
        crossorigin="anonymous"></script>
    <title>Re Plug</title>
</head>

<body>
    <header id="header"></header>
    <div class="container ">
        <main class="principal">
            <h1 class="titulo-coleta">Pontos de coleta</h1>

            <div class="row">
                <div id="busca-container" class="">
                    <div class="col-md-6">
                        <label for="endereco">Exemplo: (Rua ou Avenida), (número), São Paulo ou 00000-000(cep)</label>
                        <input type="text" class="form-control" id="input-endereco"
                            placeholder="Digite um endereço ou CEP..."><br>
                        <button id="btn-buscar" class="btn btn-primary">Buscar</button>
                    </div>
                </div>
            </div>
            <button class="mt-3 btn btn-success" id="btn-location">Usar minha localização atual</button>
            <div class="row mt-2">
                <div id="map" class="col-md-6"></div>

                <div class="lista-enderecos col-md-4 offset-md-2">
                    <h2>Lista de endereços:</h2>
                    <ul id="lista"></ul>
                </div>
            </div>
        </main>
    </div>
    <footer id="footer"></footer>
    <script type="module" src="../include.js"></script>
    <script type="module" src="./js/main.js"></script>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</body>

</html>
